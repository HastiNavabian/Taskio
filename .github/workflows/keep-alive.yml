name: Keep Supabase awake

# Supabase pauses free-tier projects after a period of inactivity.
# This sends one tiny read request every 3 days so the project stays active.
on:
  schedule:
    - cron: "17 6 */3 * *" # 06:17 UTC, every 3 days
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi

          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tasks?select=id&limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase responded with HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Ping failed. The project may be paused or the secrets are wrong."
            exit 1
          fi
